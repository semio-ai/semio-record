[package]
name = "semio-record"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
arora-types = "2"
async-trait = "0.1"
chrono = "0.4"
derive_more = "0.99"
futures = "0.3"
once_cell = "1"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
indexmap = { version = "2", features = ["serde"] }
schemars = { version = "0.8", features = ["derive", "uuid1", "indexmap2"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[features]
js = ["dep:wasm-bindgen", "uuid/wasm-bindgen"]

[dev-dependencies]
serde_yaml = "0.9"

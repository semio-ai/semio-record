[package]
name = "semio-record-bind"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
semio-record = { path = "../semio-record", features = ["schemars"] }
anyhow = "1.0.55"
async-trait = "0.1.52"
chrono = "0.4.19"
derive_more = "0.99.17"
futures = "0.3.21"
juniper = "0.15.9"
once_cell = "1.9.0"
rmp-serde = "1.0.0"
semver = { version = "1.0.5", features = ["serde"] }
serde = { version = "1.0.136", features = ["derive"] }
serde_json = "1.0.79"
uuid = { version = "1", features = ["serde", "v4"] }
schemars = { version = "0.8", features = ["derive", "uuid1"] }
tokio = { version = "1.21.0", features = ["full"] }
clap = { version = "3.2.22", features = ["derive"] }
camino = "1.1.1"
pathdiff = { version = "0.2.1", features = ["camino"] }
bimap = "0.6.2"
rand = "0.8.5"
